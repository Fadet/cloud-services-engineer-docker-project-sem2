name: momo-store

services:
  backend:
    build:
      context: ./backend
    image: momo-store-backend:latest
    expose:
      - "8081"
    ports:
      - "${BACKEND_DEBUG_PORT:-18081}:8081"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8081/health"]
      interval: 5s
      timeout: 3s
      start_period: 5s
      retries: 3
    restart: "no"

  lb:
    image: nginxinc/nginx-unprivileged:1.27-alpine
    volumes:
      - ./nginx/lb.conf.template:/etc/nginx/templates/default.conf.template:ro
    ports:
      - "${BACKEND_PORT:-8081}:8081"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8081/lb-health"]
      interval: 10s
      timeout: 3s
      start_period: 5s
      retries: 3
    restart: "no"

  frontend:
    build:
      context: ./frontend
      args:
        VUE_APP_API_URL: http://localhost:${BACKEND_PORT:-8081}
    image: momo-store-frontend:latest
    ports:
      - "${FRONTEND_PORT:-80}:8080"
    depends_on:
      lb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      start_period: 5s
      retries: 3
    restart: "no"
