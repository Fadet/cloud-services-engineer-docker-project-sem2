name: momo-store

services:
  backend:
    build:
      context: ./backend
    image: momo-store-backend:latest
    expose:
      - "8081"
    deploy:
      replicas: 3
      resources:
        limits:
          cpus: "0.50"
          memory: 128M
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8081/health"]
      interval: 5s
      timeout: 3s
      start_period: 5s
      retries: 3
    restart: unless-stopped
    networks: [momo-net]

  lb:
    image: nginxinc/nginx-unprivileged:1.27-alpine
    volumes:
      - ./nginx/lb.conf.template:/etc/nginx/templates/default.conf.template:ro
    ports:
      - "${BACKEND_PORT:-8081}:8081"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8081/lb-health"]
      interval: 10s
      timeout: 3s
      start_period: 5s
      retries: 3
    restart: unless-stopped
    networks: [momo-net]

  frontend:
    build:
      context: ./frontend
      args:
        VUE_APP_API_URL: http://localhost:${BACKEND_PORT:-8081}
    image: momo-store-frontend:latest
    ports:
      - "${FRONTEND_PORT:-80}:8080"
    depends_on:
      lb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      start_period: 5s
      retries: 3
    restart: unless-stopped
    networks: [momo-net]

networks:
  momo-net:
    driver: bridge
